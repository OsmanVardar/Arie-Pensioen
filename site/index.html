<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e6b4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Arie">
<title>Vandaag</title>
<link rel="icon" href="icoon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="stijl.css">
</head>
<body>
<div class="wrap">

  <div id="waarschuwing" class="waarschuwing" hidden></div>

  <header class="hero">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
        <circle class="ring-fg" cx="100" cy="100" r="88" id="ring"></circle>
      </svg>
      <div class="ring-inhoud">
        <div class="getal" id="getal">–</div>
        <div class="getal-label" id="getallabel">dagen</div>
      </div>
    </div>
    <div class="subtitel" id="subtitel"></div>
    <div class="mijlpaal" id="mijlpaal" hidden></div>
    <div class="cijfers" id="cijfers"></div>
  </header>

  <div class="kaart">
    <div class="kop" id="kaartkop"></div>
    <div class="bericht" id="bericht"></div>
  </div>

  <div class="knoppen">
    <a class="knop wa" id="wa" href="#">Openen in WhatsApp</a>
    <div class="rij">
      <button id="kopieer">Kopieer tekst</button>
      <button id="markeer">Markeer verstuurd</button>
    </div>
  </div>
  <div class="melding" id="melding"></div>

  <div class="dagnav">
    <button id="vorige">&larr; dag ervoor</button>
    <button id="vandaag">vandaag</button>
    <button id="volgende">dag erna &rarr;</button>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var A = window.Aftellen, cfg = A.cfg;
  var el = function (id) { return document.getElementById(id); };
  var actief = A.actueleDag();
  var OMTREK = 2 * Math.PI * 88;

  A.navTekenen('index.html');

  var w = A.waarschuwingen();
  if (w.length) { el('waarschuwing').hidden = false; el('waarschuwing').textContent = w.join(' '); }

  function melding(tekst) {
    el('melding').textContent = tekst;
    clearTimeout(melding.t);
    melding.t = setTimeout(function () { el('melding').textContent = ''; }, 2500);
  }

  function cijfersTekenen(b) {
    var vakken = [];
    if (cfg.heeftRooster && b.dienstenTeGaan !== undefined) {
      vakken.push([b.dienstenTeGaan, b.dienstenTeGaan === 1 ? 'dienst' : 'diensten']);
    }
    vakken.push([Math.ceil(actief / 7), actief <= 7 ? 'week' : 'weken']);
    vakken.push([A.aantalVerstuurd(), 'verstuurd']);

    el('cijfers').innerHTML = '';
    vakken.forEach(function (v) {
      var d = document.createElement('div');
      d.className = 'cijfer';
      var n = document.createElement('b'); n.textContent = v[0];
      var s = document.createElement('span'); s.textContent = v[1];
      d.appendChild(n); d.appendChild(s);
      el('cijfers').appendChild(d);
    });
  }

  function tekenen() {
    var b = A.perDag[actief];
    if (!b) return;
    var isVandaag = actief === A.dagVandaag;

    el('getal').textContent = actief;
    el('getallabel').textContent = actief === 0 ? 'klaar' : (actief === 1 ? 'dag' : 'dagen');

    var gedaan = cfg.startDag - actief;
    var deel = gedaan / Math.max(cfg.startDag, 1);
    el('ring').style.strokeDasharray = OMTREK;
    el('ring').style.strokeDashoffset = OMTREK * (1 - deel);

    el('subtitel').innerHTML = actief === 0
      ? '<b>' + cfg.naam + ' is met pensioen</b>'
      : (isVandaag ? 'tot 1 mei 2027 &middot; <b>' + gedaan + '</b> van ' + cfg.startDag + ' achter de rug'
                   : 'vooruitkijken naar ' + A.langeDatum(b.datum));

    // mijlpaalbanner
    var mp = (b.mijlpalen || []);
    if (mp.length) {
      el('mijlpaal').hidden = false;
      el('mijlpaal').innerHTML = mp.map(function (m) {
        return (A.MIJLPAALNAMEN[m] || m).toUpperCase();
      }).join(' &middot; ') + '<small>' + A.langeDatum(b.datum) + '</small>';
    } else {
      el('mijlpaal').hidden = true;
    }

    cijfersTekenen(b);

    el('kaartkop').innerHTML = '';
    var datum = document.createElement('span');
    datum.textContent = A.langeDatum(b.datum) + (isVandaag ? ' · vandaag' : '');
    el('kaartkop').appendChild(datum);

    if (b.dienst) {
      var badge = document.createElement('span');
      badge.className = 'dienst ' + b.dienst;
      badge.textContent = b.dienst === 'vroeg' ? 'ochtend' : b.dienst;
      el('kaartkop').appendChild(badge);
    }

    el('bericht').textContent = A.tekstVoor(actief);
    el('wa').href = A.waLink(actief);

    var m = el('markeer');
    if (A.verstuurd(actief)) { m.textContent = '✓ verstuurd'; m.classList.add('gedaan'); }
    else { m.textContent = 'Markeer verstuurd'; m.classList.remove('gedaan'); }

    el('vorige').disabled = actief >= cfg.startDag;
    el('volgende').disabled = actief <= 0;
    el('vandaag').hidden = isVandaag;

    document.body.classList.toggle('feest', actief === 0);
    if (actief === 0) confetti();
  }

  function confetti() {
    if (document.querySelector('.confetti')) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var laag = document.createElement('div');
    laag.className = 'confetti';
    var kleuren = ['#d4573d', '#d99a1f', '#0e6b4f', '#8257b8', '#25d366'];
    for (var i = 0; i < 60; i++) {
      var s = document.createElement('i');
      s.style.left = (Math.random() * 100) + '%';
      s.style.background = kleuren[i % kleuren.length];
      s.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
      s.style.animationDelay = (Math.random() * 2) + 's';
      laag.appendChild(s);
    }
    document.body.appendChild(laag);
    setTimeout(function () { laag.remove(); }, 9000);
  }

  el('vorige').onclick = function () { if (actief < cfg.startDag) { actief++; tekenen(); } };
  el('volgende').onclick = function () { if (actief > 0) { actief--; tekenen(); } };
  el('vandaag').onclick = function () { actief = A.actueleDag(); tekenen(); };

  el('kopieer').onclick = function () {
    var t = A.tekstVoor(actief);
    if (navigator.clipboard) {
      navigator.clipboard.writeText(t).then(
        function () { melding('Tekst gekopieerd'); },
        function () { melding('Kopiëren lukte niet'); });
    } else melding('Kopiëren kan hier niet');
  };

  el('markeer').onclick = function () { A.verstuurd(actief, !A.verstuurd(actief)); tekenen(); };

  el('wa').addEventListener('click', function () {
    if (!A.nummerOk()) return;
    A.verstuurd(actief, true);
    setTimeout(tekenen, 400);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') el('vorige').click();
    if (e.key === 'ArrowRight') el('volgende').click();
  });

  tekenen();
})();
</script>
</body>
</html>
